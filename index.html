<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">

</head>
<body>
  <h1>RawGraphs</h1>
  <object 
    type="image/svg+xml" 
    data="./te_leche_cafe_corregido.svg"
    width="805"
    height="250">
</object> 
  <hr/>
  <h1>Flourish</h1>
  <div class="flourish-embed flourish-chart" data-src="visualisation/30003352"><script src="https://public.flourish.studio/resources/embed.js"></script><noscript><img src="https://public.flourish.studio/visualisation/30003352/thumbnail" width="100%" alt="chart visualization" /></noscript></div>
  <hr/>
  <h1>DataWrapper</h1>
    <iframe 
    title="male and female preferences for pizza toppings" 
    aria-label="Range Plot" 
    id="datawrapper-chart-FR4gb" 
    src="https://datawrapper.dwcdn.net/FR4gb/1/" 
    scrolling="no" 
    frameborder="0" 
    style="width: 0; min-width: 100% !important; border: none;" 
    height="451" 
    data-external="1">
  </iframe>

  <script type="text/javascript">
    (function(){
      function e(){
        window.addEventListener(`message`, function(e){
          if(e.data[`datawrapper-height`] !== void 0){
            var t = document.querySelectorAll(`iframe`);
            for(var n in e.data[`datawrapper-height`])
              for(var r = 0, i; i = t[r]; r++)
                if(i.contentWindow === e.source){
                  var a = e.data[`datawrapper-height`][n] + `px`;
                  i.style.height = a;
                }
          }
        })
      }
      e()
    })();
  </script>
</body>
</html>
